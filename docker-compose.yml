services:
  # Режим разработки
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"  # Пробрасываем порт на компьютер
    volumes:
      - .:/app       # Монтируем папку с кодом для автообновления
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  # Режим продакшена
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"      # Будет доступен на localhost:80